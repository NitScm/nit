openapi: 3.0.3

info:
  title: nit API
  version: "1"
  description: |
    nit is an authorization layer between developers and a git forge. It decides,
    file by file, what each developer may read and write, and it is the only
    writer of the upstream repository.

    There are two surfaces here.

    **The developer API** (`/v1/push`, `/v1/pull`, `/v1/tasks/…`) is what the
    `nit` CLI speaks. Its central idea is the **sync point**: a developer's
    workspace is a *filtered projection* of the upstream repository — files they
    may not read are absent, so their trees and commit hashes differ from
    upstream, and a local commit hash exists nowhere on the forge. The server
    therefore records which upstream commit produced a workspace's current state,
    and hands the client an opaque, signed token for it. Every exchange is
    expressed relative to that token, never relative to a local hash.

    **The operations API** (`/v1/admin/…`) is what `nitctl` and the web console
    read. It is read-only: everything that changes authorization goes through
    the policy bundle, which is authored in files and reviewed like code.

    Two behaviours are worth knowing before reading further:

    - **A push is fail-closed.** If a patch touches any path its author may not
      write, the whole push is refused with the complete list of problems. It is
      not silently stripped of the offending file — that would leave the author
      believing their change landed while upstream received a partial commit.
    - **A pull is filtered, never refused.** The developer receives what they may
      read; the report gives a *count* of what was withheld, without the paths,
      because naming them would leak the structure the read rules exist to hide.

  license:
    name: See the repository

servers:
  - url: http://localhost:8080
    description: A local development server
  - url: https://nit.example.com
    description: A deployment

tags:
  - name: developer
    description: What the `nit` CLI calls.
  - name: operations
    description: |
      Read-only. Restricted to the groups named in the server's
      `NIT_ADMIN_GROUPS`; anyone else gets 404 rather than 403, because the
      existence of an operations API is not something an ordinary developer
      needs confirmed.
  - name: meta
    description: Identity, repositories, workspaces and liveness.

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # meta
  # ---------------------------------------------------------------------------

  /healthz:
    get:
      tags: [meta]
      summary: Liveness
      description: |
        Unauthenticated, because a load balancer has no token.

        It reports the policy version in force, which is what makes a rolling
        deploy diagnosable: two replicas serving different bundles is otherwise
        invisible.
      security: []
      operationId: health
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /openapi.yaml:
    get:
      tags: [meta]
      summary: This description
      description: |
        Served unauthenticated, deliberately: it describes how to authenticate,
        so a client that cannot read it yet is exactly the client that needs it.

        It is embedded in the binary, so a deployment always describes the API it
        actually implements — and a test asserts that every route the server
        registers appears here, and that nothing here is unserved.
      security: []
      operationId: openapi
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /v1/whoami:
    get:
      tags: [meta]
      summary: The authenticated identity
      description: |
        Returns the caller's policy identity and the groups it resolves to,
        expanded transitively. `nit login` calls this to verify a token before
        storing it.
      operationId: whoami
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/repositories:
    get:
      tags: [meta]
      summary: Repositories the caller can read something in
      description: |
        Not every repository under nit control — only those the policy grants the
        caller read on somewhere. Listing all of them would tell a contractor the
        names of every project in the company, which is the kind of leak this
        product exists to prevent.
      operationId: listRepositories
      responses:
        "200":
          description: Visible repositories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/workspaces:
    get:
      tags: [meta]
      summary: The caller's workspaces
      operationId: listWorkspaces
      responses:
        "200":
          description: The caller's registered checkouts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [meta]
      summary: Register a checkout
      description: |
        A workspace is created explicitly rather than implied by the first push,
        because it is the key of a sync point: auto-creating one for an
        unrecognized id would let a typo silently start a second, empty
        projection instead of failing.

        A developer with a laptop and a desktop registers two, and each keeps its
        own sync point.
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: Free text shown to operators, typically a machine name.
                  example: laptop
      responses:
        "201":
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # developer
  # ---------------------------------------------------------------------------

  /v1/blobs:
    post:
      tags: [developer]
      summary: Upload a patch
      description: |
        The body is the compressed patch, sent verbatim. Uploading is
        unprivileged: writing bytes into a content-addressed store reveals
        nothing and grants nothing. Reading is the operation that needs
        authorization, and it goes through the task that produced the patch.

        The client produces the patch with:

        ```
        git diff --binary --full-index --find-renames --no-ext-diff --no-textconv \
            $base..HEAD
        ```

        `--binary` keeps binary files as deltas, `--full-index` is required for
        three-way application on the server, and `--no-ext-diff --no-textconv`
        stop a developer's diff configuration from changing what nit sees.
      operationId: uploadBlob
      parameters:
        - in: header
          name: X-Nit-Digest
          required: false
          schema:
            type: string
            example: "sha256:9f2c1ab4e5d6…"
          description: |
            The digest the client computed. When present the server verifies it
            and discards a mismatch, so a corrupted upload cannot be stored under
            a name that does not describe it.
        - in: header
          name: X-Nit-Encoding
          required: false
          schema:
            $ref: "#/components/schemas/Encoding"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The stored blob.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blob"
        "400":
          description: The bytes do not match the announced digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"

  /v1/push:
    post:
      tags: [developer]
      summary: Submit a change
      description: |
        Authorization happens here, before anything is queued, so a refused push
        costs no clone.

        The order of operations is the design:

        1. deduplicate on `request_id`, so a retry cannot become a second
           upstream commit;
        2. verify `base_sync` against the workspace's recorded sync point, so the
           patch is applied to the base its author actually had;
        3. run the policy over the parsed patch;
        4. refuse, or store the *enforced* patch and enqueue.

        On refusal the response lists **every** offending path, not just the
        first, so the developer fixes them in one round trip.
      operationId: push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
      responses:
        "200":
          description: |
            A dry run (`dry_run: true`). Nothing was queued and the forge did not
            move; the report says what would have happened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResponse"
        "202":
          description: |
            Accepted and queued. A repeated `request_id` returns the original
            task rather than creating a second one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResponse"
        "400":
          description: |
            The request or the patch is malformed — an unparseable patch, a
            combined (merge) diff, a blob that was never uploaded, or a sync
            token issued for another workspace, repository or branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            `unauthorized_paths`. The patch touches paths the author may not
            change, and **nothing was applied**. `denials` names each path, the
            action required, the rule that refused it and that rule's message to
            the developer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unauthorized_paths
                message: the patch touches paths you may not change
                denials:
                  - path: secrets/prod.env
                    action: create
                    rule_id: secrets-are-platform-only
                    pattern: "secrets/"
                    reason: denied_by_rule
                    description: Production secrets are owned by the platform team.
        "404":
          description: Unknown repository, or a workspace that is not the caller's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            `unknown_sync_point` — the workspace has never pulled — or
            `stale_sync_point`, meaning it is behind. Both are fixed by `nit pull`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/TooLarge"

  /v1/pull:
    post:
      tags: [developer]
      summary: Request upstream changes
      description: |
        Nothing is authorized here. A pull cannot be refused — the developer
        simply does not receive what they may not read — and what is readable has
        to be decided against the bundle in force when the diff is *produced*,
        not when the request was accepted. The filtering therefore happens in the
        worker, next to the diff.

        The diff base comes from the client's signed token, not from the server's
        stored record. The two diverge whenever a pull is delivered and the client
        fails to apply it; deriving the diff from where the client says it is
        makes that case self-correcting.

        An empty `sync` asks for a full filtered snapshot, which is what
        `nit clone` sends.
      operationId: pull
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequest"
      responses:
        "202":
          description: Queued, or already up to date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullResponse"
        "400":
          description: Malformed request, or an invalid sync token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown repository, or a workspace that is not the caller's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/tasks/{id}:
    get:
      tags: [developer]
      summary: Task state
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownTask"

  /v1/tasks/{id}/events:
    get:
      tags: [developer]
      summary: Wait for a task (long poll)
      description: |
        Held open until the task changes state or `NIT_EVENT_MAX_WAIT` elapses,
        then answered either way; the client reconnects.

        This is how a waiting CLI learns its task finished, and it is deliberately
        the *client* that holds the connection: a developer machine sits behind
        NAT and is not addressable, so a design where the server called back would
        need tunnels or an agent.

        A terminal event carries the whole task, so no follow-up request is
        needed.
      operationId: taskEvents
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: A state change, or a timeout with the state unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownTask"

  /v1/tasks/{id}/patch:
    get:
      tags: [developer]
      summary: Download the patch a task produced
      description: |
        Patches are fetched through their task, not from a content-addressed blob
        endpoint. Authorization is then "does this task belong to you?" — a
        question with an answer — instead of "do you know this digest?", which
        would make an unguessable identifier the only thing standing between a
        filtered patch and the people it was filtered *for*.

        The body is the compressed patch; `X-Nit-Digest` carries its digest so
        the client can verify what it received.
      operationId: taskPatch
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The patch.
          headers:
            X-Nit-Digest:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown task, or the task produced no patch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The task has not finished yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: |
            The artifact expired (`NIT_PULL_TTL`). Request the pull again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # operations
  # ---------------------------------------------------------------------------

  /v1/admin/stats:
    get:
      tags: [operations]
      summary: Queue depth, task counts and recent denials
      description: |
        `queue_depth` and `busy_branches` are the only numbers that mean
        something is wrong *right now*; `recent_denials` says whether the policy
        is fighting the team.
      operationId: adminStats
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "404":
          $ref: "#/components/responses/NotAnOperator"

  /v1/admin/tasks:
    get:
      tags: [operations]
      summary: List tasks
      operationId: adminTasks
      parameters:
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/TaskState"
          description: Repeatable.
        - in: query
          name: kind
          schema:
            $ref: "#/components/schemas/TaskKind"
          description: Repeatable.
        - in: query
          name: repository
          schema:
            type: string
        - in: query
          name: branch
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        "200":
          description: Matching tasks, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTask"
        "404":
          $ref: "#/components/responses/NotAnOperator"

  /v1/admin/tasks/{id}:
    get:
      tags: [operations]
      summary: One task, with the spec its worker was given
      description: |
        `payload` is exactly what the worker was told to do and `result` what it
        reported, so an operator can see the difference between "nit decided
        something surprising" and "the forge did something surprising".
      operationId: adminTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTaskDetail"
        "404":
          $ref: "#/components/responses/NotAnOperator"

  /v1/admin/audit:
    get:
      tags: [operations]
      summary: Query the audit log
      description: |
        Who did what, when, and under which rule — the question a permission
        system exists to answer.

        Records are append-only at the database level: `DO INSTEAD NOTHING` rules
        block UPDATE and DELETE, so an application bug cannot rewrite history.
        Every record carries the policy version in force at the time, so a past
        decision can be replayed against exactly the rules that produced it.
      operationId: adminAudit
      parameters:
        - in: query
          name: user
          schema:
            type: string
          description: A policy user id.
        - in: query
          name: repository
          schema:
            type: string
        - in: query
          name: request_id
          schema:
            type: string
          description: |
            Follows one operation from the client's error message through the API
            log to the rule that refused it.
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        "200":
          description: Matching records, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditRecord"
        "400":
          description: A malformed timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotAnOperator"

  /v1/admin/policy:
    get:
      tags: [operations]
      summary: The compiled policy bundle in force
      description: |
        Read-only, and it always will be: rules are authored in files and reviewed
        like code, so a console that could edit them would be a second,
        unreviewed path to the same decisions.
      operationId: adminPolicy
      responses:
        "200":
          description: The bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyBundle"
        "404":
          $ref: "#/components/responses/NotAnOperator"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A token issued with `nitctl token create -user <id>`. Only its SHA-256 is
        stored, so there is no recovery path: a lost token is reissued, not
        retrieved. The `nit_` prefix exists so secret scanners recognize a leaked
        credential on sight.

  parameters:
    TaskId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: |
        The credential is missing, malformed, expired, revoked or unknown. The
        `code` distinguishes them, because the right action differs: an expired
        token means "log in again", an unknown one means something is wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: |
        The account is disabled, or it is not in the policy bundle — which is a
        configuration problem an administrator has to fix, not something the
        developer can.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotAnOperator:
      description: |
        Not found. Returned both for a genuinely missing record and for a caller
        who is not in the server's `NIT_ADMIN_GROUPS`: the existence of an
        operations API is not something an ordinary developer needs confirmed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UnknownTask:
      description: |
        Unknown task — including one that belongs to somebody else. 404 rather
        than 403, because a caller has no business learning which task ids exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TooLarge:
      description: The payload exceeds `NIT_MAX_PATCH_BYTES`, compressed or decompressed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: |
        The body of every non-2xx response. Clients branch on `code`, never on
        `message`.
      required: [code, message]
      properties:
        code:
          type: string
          description: A stable, machine-readable identifier.
          enum:
            - unauthorized_paths
            - stale_sync_point
            - unknown_sync_point
            - branch_busy
            - patch_too_large
            - unsupported_version
            - unknown_repository
            - conflict
            - bad_request
            - no_credentials
            - malformed_credentials
            - invalid_token
            - token_expired
            - token_revoked
            - user_disabled
            - user_not_in_policy
            - unknown_workspace
            - unknown_task
            - unknown_blob
            - digest_mismatch
            - task_not_ready
            - patch_expired
            - not_found
            - internal
        message:
          type: string
        denials:
          type: array
          description: Present when `code` is `unauthorized_paths`.
          items:
            $ref: "#/components/schemas/Denial"
        retry_after:
          type: integer
          format: int64
          description: Nanoseconds. Set when the request may succeed later unchanged.

    Denial:
      type: object
      description: One refused path, with the rule that refused it.
      required: [path, action, reason]
      properties:
        path:
          type: string
          example: secrets/prod.env
        action:
          type: string
          enum: [read, write, create, delete, admin]
        guard:
          type: string
          description: |
            Set when the refusal came from a structural protection rather than an
            ordinary path rule. `protected_path` covers CI definitions,
            `.gitattributes` and `.gitmodules` — write access to a CI workflow is
            read access to the whole repository. `symlink` and `submodule` cover
            changes that introduce content from outside the tree.
          enum: [protected_path, symlink, submodule]
        rule_id:
          type: string
          description: Empty when nothing matched and the default deny applied.
        pattern:
          type: string
        reason:
          type: string
          enum:
            - allowed_by_rule
            - denied_by_rule
            - no_matching_rule
            - unknown_repository
            - user_disabled
        description:
          type: string
          description: The rule author's message to the developer.

    Encoding:
      type: string
      enum: [zstd, none]
      default: zstd

    Blob:
      type: object
      description: |
        A payload transferred out of band, addressed by the SHA-256 of its
        compressed bytes. Content addressing gives deduplication, resumable
        transfer, and integrity checking the client can perform itself.
      required: [digest, size, encoding]
      properties:
        digest:
          type: string
          example: "sha256:9f2c1ab4e5d6…"
        size:
          type: integer
          format: int64
          description: Compressed length.
        encoding:
          $ref: "#/components/schemas/Encoding"
        uncompressed_size:
          type: integer
          format: int64
          description: |
            Lets the receiver refuse a decompression bomb before allocating
            anything.

    SyncToken:
      type: string
      description: |
        Opaque **by contract**: store it, send it back, never parse it. It is
        signed, which is what stops a client naming a base of its own choosing
        and having the server apply a patch there.
      example: "st1.eyJ3IjoiZjllNDI4YWIi….Yk9wR0hzS0RwQ2c"

    PushMode:
      type: string
      enum: [reject, strip]
      default: reject
      description: |
        `reject` refuses the whole push if anything is unauthorized — the default,
        and the only mode that preserves the author's intent.

        `strip` drops the unauthorized sections. It exists for workflows that
        genuinely want it, behind an explicit `nit push --drop-unauthorized`, and
        the response enumerates what was dropped: what lands upstream then differs
        from what the author committed, and the two have to be reconciled.

    PushRequest:
      type: object
      required: [request_id, repository, branch, workspace, patch]
      properties:
        protocol_version:
          type: string
          default: "1"
        request_id:
          type: string
          description: |
            Client-generated, and what makes submission idempotent. Networks fail
            mid-push; without it a retry creates a second upstream commit.
          example: 01J8Z3Q2M7C4V9K1
        repository:
          type: string
          example: backend-api
        branch:
          type: string
          example: feature/checkout
        workspace:
          type: string
          format: uuid
        base_sync:
          $ref: "#/components/schemas/SyncToken"
        message:
          type: string
          description: |
            The commit message for the single squashed commit that lands upstream.
            Required unless `dry_run`.
        patch:
          $ref: "#/components/schemas/Blob"
        mode:
          $ref: "#/components/schemas/PushMode"
        dry_run:
          type: boolean
          default: false
          description: |
            Authorize without queueing anything. `nit push --check` uses this, and
            so can an editor integration on save.

    PushResponse:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
          description: Stable across retries carrying the same `request_id`.
        accepted:
          type: boolean
          description: False for a dry run.
        report:
          $ref: "#/components/schemas/PushReport"
        queue_position:
          type: integer
          description: |
            How many operations are ahead of this one on the same branch. A push
            on a busy branch is queued, never refused, so a developer never has to
            retry by hand.

    PushReport:
      type: object
      properties:
        policy_version:
          type: string
        files_total:
          type: integer
        files_accepted:
          type: integer
        files_denied:
          type: integer
        denials:
          type: array
          items:
            $ref: "#/components/schemas/Denial"

    PullRequest:
      type: object
      required: [request_id, repository, workspace]
      properties:
        protocol_version:
          type: string
          default: "1"
        request_id:
          type: string
        repository:
          type: string
        branch:
          type: string
          description: Defaults to the repository's default branch.
        workspace:
          type: string
          format: uuid
        sync:
          allOf:
            - $ref: "#/components/schemas/SyncToken"
          description: |
            Empty asks for a full filtered snapshot, which is what `nit clone`
            sends.

    PullResponse:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
        up_to_date:
          type: boolean
          description: True when nothing was queued because the sync point already matches upstream.

    PullResult:
      type: object
      description: Delivered on the task once a worker has produced the diff.
      properties:
        patch:
          allOf:
            - $ref: "#/components/schemas/Blob"
          description: |
            Absent when the filtered diff turned out empty — every upstream change
            was withheld — in which case only the sync point moves.
        next_sync:
          $ref: "#/components/schemas/SyncToken"
        report:
          $ref: "#/components/schemas/PullReport"

    PullReport:
      type: object
      properties:
        policy_version:
          type: string
        files_total:
          type: integer
        files_delivered:
          type: integer
        files_withheld:
          type: integer
          description: |
            A count, deliberately without the paths: naming them would leak the
            structure the read rules exist to hide. It is reported at all because
            a developer who does not know something was withheld will mistake a
            missing file for a deleted one.
        upstream_commit:
          type: string

    PushResult:
      type: object
      description: Delivered on the task once a worker has published the change.
      properties:
        upstream_commit:
          type: string
          description: The commit created on the forge.
        next_sync:
          allOf:
            - $ref: "#/components/schemas/SyncToken"
          description: |
            **Empty means the workspace is no longer a faithful projection** — the
            branch moved under the push and the change was rebased, or sections
            were stripped. The client must pull before pushing again. "Your push
            landed, now pull" is a normal outcome, not an error.
        report:
          $ref: "#/components/schemas/PushReport"

    TaskKind:
      type: string
      enum: [push, pull]

    TaskState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
      description: |
        A push on a busy branch sits in `queued` rather than being refused: the
        queue is what serializes a branch.

    Task:
      type: object
      description: The developer's view of a task.
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/TaskKind"
        state:
          $ref: "#/components/schemas/TaskState"
        repository:
          type: string
        branch:
          type: string
        queue_position:
          type: integer
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/Error"
        push_result:
          $ref: "#/components/schemas/PushResult"
        pull_result:
          $ref: "#/components/schemas/PullResult"

    Event:
      type: object
      description: One message of a task's event stream.
      properties:
        task_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/TaskState"
        at:
          type: string
          format: date-time
        message:
          type: string
          description: Human-readable progress, so a slow operation does not look hung.
        task:
          allOf:
            - $ref: "#/components/schemas/Task"
          description: Carried once the task is terminal, so no follow-up request is needed.

    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
        protocol_version:
          type: string
        policy_version:
          type: string

    WhoAmI:
      type: object
      properties:
        user:
          type: string
          description: The policy identity, stable across forge account renames.
        email:
          type: string
        groups:
          type: array
          description: Expanded transitively through group inclusion.
          items:
            type: string
        policy_version:
          type: string

    Repository:
      type: object
      properties:
        id:
          type: string
        default_branch:
          type: string
        forge:
          type: string

    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string

    AdminTask:
      type: object
      description: |
        Carries more than the developer view — the owner, the attempt count, the
        lease holder — because the questions an operator asks are different: not
        "did my push land?" but "why is this branch stuck?".
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/TaskKind"
        state:
          $ref: "#/components/schemas/TaskState"
        user:
          type: string
        repository:
          type: string
        branch:
          type: string
        attempts:
          type: integer
        queue_position:
          type: integer
        lease_holder:
          type: string
          description: The worker currently executing the task.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          format: int64
        error:
          $ref: "#/components/schemas/Error"

    AdminTaskDetail:
      allOf:
        - $ref: "#/components/schemas/AdminTask"
        - type: object
          properties:
            payload:
              type: object
              description: The spec the worker was given.
              additionalProperties: true
            result:
              type: object
              description: What the worker reported.
              additionalProperties: true

    AuditRecord:
      type: object
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        actor:
          type: string
          description: |
            The policy identity of whoever acted. It survives the deletion of the
            account, so history stays readable.
        action:
          type: string
          example: push.denied_path
          description: |
            `push.accepted`, `push.rejected`, `push.denied_path`, `push.applied`,
            `pull.requested`, `pull.delivered`.
        repository:
          type: string
        branch:
          type: string
        path:
          type: string
        effect:
          type: string
          enum: [allow, deny]
        reason:
          type: string
        rule_id:
          type: string
        guard:
          type: string
        policy_version:
          type: string
          description: |
            The bundle in force at the time, so a past decision can be replayed
            against exactly the rules that produced it.
        request_id:
          type: string
        task_id:
          type: string
          format: uuid

    Stats:
      type: object
      properties:
        policy_version:
          type: string
        tasks:
          type: object
          additionalProperties:
            type: integer
          description: Counts keyed by state.
        queue_depth:
          type: integer
        busy_branches:
          type: integer
          description: Branches currently held by a running push.
        repositories:
          type: integer
        users:
          type: integer
        groups:
          type: integer
        recent_denials:
          type: integer
          description: Refused paths over the last day.

    PolicyBundle:
      type: object
      properties:
        version:
          type: string
          description: A content hash of the bundle.
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PolicyGroup"
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRepository"

    PolicyGroup:
      type: object
      description: |
        A group as the running server resolved it. `members` is effective
        membership — everyone the group reaches, including through `includes` —
        and not the list in `groups.yaml`. Where membership comes from somewhere
        the files do not name, such as a directory read at run time, the files
        answer the wrong question and this is where the right one is asked.
      properties:
        id:
          type: string
        description:
          type: string
        members:
          type: array
          items:
            type: string
        includes:
          type: array
          items:
            type: string

    PolicyRepository:
      type: object
      properties:
        id:
          type: string
        remote:
          type: string
        forge:
          type: string
        default_branch:
          type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"

    PolicyRule:
      type: object
      description: |
        Evaluation is order-independent: every matching rule is considered, deny
        always wins over allow, and anything unmatched is denied.
      properties:
        id:
          type: string
        subject:
          type: string
          example: "group:backend"
        except:
          type: array
          description: |
            Subjects carved out of `subject`. Since deny always wins, an exemption
            cannot be expressed as a competing allow rule — it would be swallowed.
          items:
            type: string
        paths:
          type: array
          description: |
            A trailing slash means a subtree (`secrets/`); anything else is a glob
            (`**/*.env`).
          items:
            type: string
        refs:
          type: array
          description: Empty means every ref.
          items:
            type: string
        actions:
          type: array
          items:
            type: string
            enum: [read, write, create, delete, admin]
        effect:
          type: string
          enum: [allow, deny]
        description:
          type: string
          description: Shown to the developer when this rule denies them.
