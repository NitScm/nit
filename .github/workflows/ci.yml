# The checks every change has to pass.
#
# The database services are the point of this file. Without NIT_TEST_POSTGRES
# and NIT_TEST_MYSQL the store conformance suite skips itself and the run is
# green while the queue, the sync points and the audit trail go untested —
# which is precisely where four real bugs were found by running against a
# database rather than a mock, the fourth being an InnoDB deadlock that only
# appears under concurrency on one of the three backends.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # MySQL and MariaDB both, not one of them. They agree on everything nit
      # uses, and running only one is how that stops being true without anyone
      # noticing.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nit
          MYSQL_DATABASE: nit_test
        ports: ['3308:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -unit_test -pnit || mysqladmin ping -h 127.0.0.1 -uroot -pnit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: nit
          MARIADB_DATABASE: nit_test
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # Two databases, and they are not interchangeable.
      #
      # nit_test holds the schema the store conformance suite truncates between
      # cases, so it has to be migrated first — without that every case fails
      # with `relation "audit_log" does not exist`.
      #
      # nit_migrate_test is left empty on purpose: TestMigrateIsIdempotent
      # resets it and asserts that a fresh database receives every migration.
      - name: Prepare the test databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE nit_migrate_test'
          go run ./cmd/nitctl migrate -dsn 'postgres://postgres:postgres@localhost:5432/nit_test'
          go run ./cmd/nitctl migrate -dsn 'root:nit@tcp(127.0.0.1:3308)/nit_test'
          go run ./cmd/nitctl migrate -dsn 'root:nit@tcp(127.0.0.1:3307)/nit_test'

      # NIT_TEST_MYSQL names one server, so the suite runs twice: once here
      # against MySQL with everything else, and once below against MariaDB.
      - name: Test with the race detector
        env:
          NIT_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/nit_test
          NIT_TEST_POSTGRES_MIGRATE: postgres://postgres:postgres@localhost:5432/nit_migrate_test
          NIT_TEST_MYSQL: root:nit@tcp(127.0.0.1:3308)/nit_test
        run: go test -race -count=1 ./...

      - name: Store conformance against MariaDB
        env:
          NIT_TEST_MYSQL: root:nit@tcp(127.0.0.1:3307)/nit_test
        run: go test -race -count=1 ./internal/store/mysql/

      - name: Policy validation dataset
        run: |
          go build -o bin/nitctl ./cmd/nitctl
          PATH="$PWD/bin:$PATH" ./examples/github-ssh/check-policy.sh ./examples/github-ssh/policy

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A release ships these targets, so a change that breaks one of them
      # should fail here rather than during a release.
      - name: Build every released target
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/...
          done
          for target in windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/nit ./cmd/nitctl
          done
